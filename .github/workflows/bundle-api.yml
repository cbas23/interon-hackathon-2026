name: Bundle API for Lambda

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck API
        run: bun --cwd apps/api typecheck

      - name: Bundle Lambda
        run: |
          mkdir -p lambda
          bun build apps/api/src/lambda.ts --target=node --format=esm --outfile=lambda/index.mjs

      - name: Upload Lambda package
        uses: actions/upload-artifact@v4
        with:
          name: interon-api-lambda
          path: lambda/index.mjs
          if-no-files-found: error
          retention-days: 7
